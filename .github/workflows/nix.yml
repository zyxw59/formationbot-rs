name: Nix and container

on: 
  - push

jobs:
  container:
    name: Build derivation
    runs-on: ubuntu-latest
    # Predefined variables: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main' # Run only branches (tags and main will build and publish)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - run: nix-build
  container_publish:
    name: Build and publish docker container
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/container' || github.ref_type == 'tag' # Run only on main or tags
    env:
      DOCKER_NAME: "ghcr.io/${{ github.repository }}/discord-bot"
      # If it's neither the main nor container branches, it must be a tag -- just use the tag name
      DOCKER_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref == 'refs/heads/container' && 'testing' || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        run: docker login ghcr.io -u ${GITHUB_ACTOR} -p "${{ secrets.GITHUB_TOKEN }}"
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - name: Run nix-build
        run: |
          nix-build --arg dockerName "\"$DOCKER_NAME\"" --arg dockerTag "\"$DOCKER_TAG\"" -A docker
      - name: Debugging info
        run: |
          echo nix-build --arg dockerName "\"$DOCKER_NAME\"" --arg dockerTag "\"$DOCKER_TAG\"" -A docker
          ls
          ls -l
          env
      - name: Build and publish docker image
        run: |
          docker load < result
          docker push "$DOCKER_NAME":"$DOCKER_TAG"
